
name: Build MyStopwatch EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build Windows EXE
        run: python -m PyInstaller --onefile --windowed --name MyStopwatch stopwatch.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MyStopwatch-Windows
          path: dist/MyStopwatch.exe
